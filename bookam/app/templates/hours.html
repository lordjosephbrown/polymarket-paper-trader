{% extends "base.html" %}
{% block title %}Working hours — Bookam{% endblock %}
{% block nav %}{% include "_dashnav.html" %}{% endblock %}
{% block content %}
<div class="card">
  <h1>Working hours</h1>
  <p class="muted small">Clients can only book within these hours. Untick a day to close it.</p>
  <form method="post" action="/dashboard/hours">
    {% for d in days %}
    <div class="hours-row">
      <label class="hours-day">
        <input type="checkbox" name="enabled_{{ d.weekday }}" {% if d.open %}checked{% endif %}>
        {{ d.name }}
      </label>
      <input type="time" name="open_{{ d.weekday }}" value="{{ d.open }}">
      <span>–</span>
      <input type="time" name="close_{{ d.weekday }}" value="{{ d.close }}">
    </div>
    {% endfor %}
    <button class="btn btn-primary wide" type="submit">Save hours</button>
  </form>
</div>
{% endblock %}
